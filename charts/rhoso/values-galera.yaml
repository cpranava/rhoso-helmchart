# =============================================================================
# Galera - MariaDB Galera Cluster
# Ref: mariadbv1.GaleraSpecCore
# Enabled by default
# Note: map-based — each key is a named Galera cluster instance
# =============================================================================

galera:
  enabled: true

  # templates: map of named Galera cluster instances
  # Minimum: one cluster named 'openstack' for the control-plane database
  # Add 'openstack-cell1' (and further) for Nova cells
  templates:

    # Primary control-plane database
    openstack:
      # -- Number of Galera replicas (should be 1 or 3)
      # +kubebuilder:default=1
      replicas: 3

      # -- Storage size request for each Galera PVC
      # +kubebuilder:default="500M"
      storageRequest: "500M"

      # -- StorageClass override (required by CRD; empty falls back to global .Values.storageClass)
      storageClass: ""

      # -- Secret containing the database root password
      # secret: osp-secret

      # -- Resource requests/limits for the Galera container
      # resources:
      #   requests:
      #     cpu: 500m
      #     memory: 1Gi
      #   limits:
      #     cpu: 2000m
      #     memory: 2Gi

      # -- Node selector override for this cluster
      # nodeSelector: {}

    # Cell 1 database — required when Nova cell1 is configured
    openstack-cell1:
      replicas: 3
      storageRequest: "500M"
      storageClass: ""
      # secret: osp-secret
