# =============================================================================
# Designate - DNS Service
# Ref: designatev1.DesignateSpecCore
# Disabled by default
# Note: Requires a Redis instance (designate-redis).
#       Enable redis (values-redis.yaml) when enabling Designate.
#       Sub-components: API, Central, Worker, Mdns, Producer, Backendbind9, Unbound
# =============================================================================

designate:
  enabled: false

  # -- apiOverride: customize the public route or TLS for Designate API
  apiOverride:
    route: {}
    # tls:
    #   secretName: designate-public-tls

  template:
    # -- MariaDB instance name
    # +kubebuilder:default=openstack
    databaseInstance: openstack

    # -- MariaDB account name for Designate
    # +kubebuilder:default=designate
    # databaseAccount: designate

    # -- RabbitMQ cluster name
    # +kubebuilder:default=rabbitmq
    # rabbitMqClusterName: rabbitmq

    # -- Secret containing OpenStack passwords (required by CRD)
    secret: osp-secret

    # -- Redis instance name
    # +kubebuilder:default=designate-redis
    # redisServiceName: designate-redis

    # -- DNS backend type: bind9 | unbound | powerdns
    # backendType: bind9
    # backendWorkerServerProtocol: UDP
    # backendMdnsServerProtocol: UDP

    # -- Custom oslo.config snippets appended to designate.conf
    # customServiceConfig: |
    #   [DEFAULT]
    #   debug = false

    # -- API timeout in seconds
    # +kubebuilder:default=120
    # apiTimeout: 120

    # -- Nameserver records for the Designate pool
    # nsRecords:
    #   - hostname: ns1.example.com.
    #     priority: 1

    # -- Designate API sub-spec
    designateAPI:
      replicas: 1
      # override:
      #   service: {}
      # resources: {}
      # networkAttachments: []

    # -- Designate Central sub-spec
    designateCentral:
      replicas: 1
      # resources: {}

    # -- Designate Worker sub-spec
    designateWorker:
      replicas: 1
      # resources: {}

    # -- Designate Mdns sub-spec
    designateMdns:
      replicas: 1
      # networkAttachments:
      #   - designate
      # resources: {}

    # -- Designate Producer sub-spec
    designateProducer:
      replicas: 1
      # resources: {}

    # -- Designate Backendbind9 sub-spec
    designateBackendbind9:
      replicas: 1
      # networkAttachments:
      #   - designate
      # resources: {}

    # -- Designate Unbound (optional DNS resolver)
    designateUnbound:
      replicas: 0
      # networkAttachments:
      #   - designate
      # resources: {}

    # -- Node selector for all Designate pods
    # nodeSelector: {}

  # -- ApplicationCredential config (optional)
  # applicationCredential:
  #   enabled: false
