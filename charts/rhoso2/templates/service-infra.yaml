{{- define "osp.rabbitmq" -}}
rabbitmq:
  templates:
    {{- range $name, $config := .Values.spec.rabbitmq.templates }}
    {{ $name }}:
      {{- if $config.override }}
      override:
        {{- toYaml $config.override | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}

{{- define "osp.memcached" -}}
memcached:
  templates:
    {{- range $name, $config := .Values.spec.memcached.templates }}
    {{ $name }}:
      replicas: {{ $config.replicas | default 3 }}
    {{- end }}
{{- end }}
