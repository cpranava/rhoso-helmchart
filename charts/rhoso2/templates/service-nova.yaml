{{- define "osp.nova" -}}
{{- if .Values.spec.nova.enabled | default true }}
nova:
  apiOverride:
    {{- toYaml .Values.spec.nova.apiOverride | nindent 4 }}
  template:
    {{- range $key, $val := .Values.spec.nova.template }}
    {{- if ne $key "cellTemplates" }}
    {{ $key }}: {{ $val | toJson }}
    {{- end }}
    {{- end }}
    cellTemplates:
      {{- range $cellName, $cellConfig := .Values.spec.nova.template.cellTemplates }}
      {{ $cellName }}:
        {{- toYaml $cellConfig | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
